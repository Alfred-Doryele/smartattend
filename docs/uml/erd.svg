<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="720" fill="#FFFFFF"/>
  <text x="500" y="34" fill="#1A2233" font-size="18" font-weight="bold" text-anchor="middle">SmartAttend — Entity Relationship Diagram</text>

  <!-- USERS -->
  <g>
    <rect x="30" y="70" width="200" height="170" rx="6" fill="#E7ECF6" stroke="#1D3461" stroke-width="1.5"/>
    <rect x="30" y="70" width="200" height="26" fill="#1D3461"/>
    <text x="130" y="88" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">users</text>
    <text x="40" y="112" font-size="10">PK id</text>
    <text x="40" y="128" font-size="10">full_name</text>
    <text x="40" y="144" font-size="10">index_number (UQ)</text>
    <text x="40" y="160" font-size="10">email (UQ)</text>
    <text x="40" y="176" font-size="10">password_hash</text>
    <text x="40" y="192" font-size="10">role</text>
    <text x="40" y="208" font-size="10">face_descriptor</text>
    <text x="40" y="224" font-size="10">created_at</text>
  </g>

  <!-- COURSES -->
  <g>
    <rect x="380" y="70" width="190" height="100" rx="6" fill="#DFF6F2" stroke="#0F9D8C" stroke-width="1.5"/>
    <rect x="380" y="70" width="190" height="26" fill="#0F9D8C"/>
    <text x="475" y="88" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">courses</text>
    <text x="390" y="112" font-size="10">PK id</text>
    <text x="390" y="128" font-size="10">code (UQ)</text>
    <text x="390" y="144" font-size="10">title</text>
    <text x="390" y="160" font-size="10">FK lecturer_id → users</text>
  </g>

  <!-- ENROLLMENTS -->
  <g>
    <rect x="380" y="210" width="190" height="90" rx="6" fill="#DFF6F2" stroke="#0F9D8C" stroke-width="1.5"/>
    <rect x="380" y="210" width="190" height="26" fill="#0F9D8C"/>
    <text x="475" y="228" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">enrollments</text>
    <text x="390" y="252" font-size="10">PK id</text>
    <text x="390" y="268" font-size="10">FK course_id → courses</text>
    <text x="390" y="284" font-size="10">FK student_id → users</text>
  </g>

  <!-- VENUES -->
  <g>
    <rect x="730" y="70" width="200" height="110" rx="6" fill="#FDF1D6" stroke="#E3A008" stroke-width="1.5"/>
    <rect x="730" y="70" width="200" height="26" fill="#E3A008"/>
    <text x="830" y="88" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">venues</text>
    <text x="740" y="112" font-size="10">PK id</text>
    <text x="740" y="128" font-size="10">name</text>
    <text x="740" y="144" font-size="10">latitude / longitude</text>
    <text x="740" y="160" font-size="10">radius_meters</text>
  </g>

  <!-- SESSIONS -->
  <g>
    <rect x="380" y="340" width="220" height="190" rx="6" fill="#DFF6F2" stroke="#0F9D8C" stroke-width="1.5"/>
    <rect x="380" y="340" width="220" height="26" fill="#0F9D8C"/>
    <text x="490" y="358" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">sessions</text>
    <text x="390" y="382" font-size="10">PK id</text>
    <text x="390" y="398" font-size="10">FK course_id → courses</text>
    <text x="390" y="414" font-size="10">FK venue_id → venues (nullable)</text>
    <text x="390" y="430" font-size="10">venue_latitude / longitude</text>
    <text x="390" y="446" font-size="10">start_time / end_time</text>
    <text x="390" y="462" font-size="10">status</text>
    <text x="390" y="478" font-size="10">reverify_at</text>
    <text x="390" y="494" font-size="10">created_at</text>
  </g>

  <!-- CHECKINS -->
  <g>
    <rect x="30" y="340" width="220" height="270" rx="6" fill="#E7ECF6" stroke="#1D3461" stroke-width="1.5"/>
    <rect x="30" y="340" width="220" height="26" fill="#1D3461"/>
    <text x="140" y="358" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">checkins</text>
    <text x="40" y="382" font-size="10">PK id</text>
    <text x="40" y="398" font-size="10">FK session_id → sessions</text>
    <text x="40" y="414" font-size="10">FK student_id → users</text>
    <text x="40" y="430" font-size="10">checked_in_at</text>
    <text x="40" y="446" font-size="10">face_match_score / passed</text>
    <text x="40" y="462" font-size="10">student_latitude / longitude</text>
    <text x="40" y="478" font-size="10">distance_from_venue_meters</text>
    <text x="40" y="494" font-size="10">location_verified</text>
    <text x="40" y="510" font-size="10">reverified</text>
    <text x="40" y="526" font-size="10">status</text>
    <text x="40" y="542" font-size="10">UQ (session_id, student_id)</text>
  </g>

  <!-- ANOMALY_FLAGS -->
  <g>
    <rect x="730" y="340" width="220" height="160" rx="6" fill="#FDF1D6" stroke="#E3A008" stroke-width="1.5"/>
    <rect x="730" y="340" width="220" height="26" fill="#E3A008"/>
    <text x="840" y="358" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">anomaly_flags</text>
    <text x="740" y="382" font-size="10">PK id</text>
    <text x="740" y="398" font-size="10">FK checkin_id → checkins</text>
    <text x="740" y="414" font-size="10">reason</text>
    <text x="740" y="430" font-size="10">detail</text>
    <text x="740" y="446" font-size="10">resolved / resolution</text>
    <text x="740" y="462" font-size="10">FK reviewed_by → users</text>
    <text x="740" y="478" font-size="10">created_at</text>
  </g>

  <!-- PASSWORD_RESETS -->
  <g>
    <rect x="730" y="530" width="220" height="110" rx="6" fill="#E7ECF6" stroke="#1D3461" stroke-width="1.5"/>
    <rect x="730" y="530" width="220" height="26" fill="#1D3461"/>
    <text x="840" y="548" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">password_resets</text>
    <text x="740" y="572" font-size="10">PK id</text>
    <text x="740" y="588" font-size="10">FK user_id → users</text>
    <text x="740" y="604" font-size="10">token_hash / expires_at / used</text>
  </g>

  <!-- Relationship lines -->
  <line x1="230" y1="150" x2="380" y2="120" stroke="#555" stroke-width="1"/>
  <text x="300" y="130" font-size="9" fill="#555">1:M (lecturer)</text>

  <line x1="230" y1="200" x2="380" y2="255" stroke="#555" stroke-width="1"/>
  <text x="260" y="235" font-size="9" fill="#555">1:M (student)</text>

  <line x1="475" y1="170" x2="475" y2="210" stroke="#555" stroke-width="1"/>
  <text x="480" y="195" font-size="9" fill="#555">1:M</text>

  <line x1="475" y1="300" x2="480" y2="340" stroke="#555" stroke-width="1"/>
  <text x="485" y="325" font-size="9" fill="#555">1:M</text>

  <line x1="730" y1="140" x2="600" y2="400" stroke="#555" stroke-width="1"/>
  <text x="640" y="230" font-size="9" fill="#555">1:M (nullable)</text>

  <line x1="250" y1="450" x2="380" y2="440" stroke="#555" stroke-width="1"/>
  <text x="270" y="440" font-size="9" fill="#555">1:M</text>

  <line x1="140" y1="340" x2="140" y2="240" stroke="#555" stroke-width="1"/>
  <line x1="140" y1="240" x2="130" y2="240" stroke="#555" stroke-width="1"/>
  <text x="145" y="290" font-size="9" fill="#555">1:M (student)</text>

  <line x1="730" y1="420" x2="250" y2="420" stroke="#555" stroke-width="1"/>
  <text x="480" y="410" font-size="9" fill="#555">1:M</text>

  <line x1="840" y1="500" x2="840" y2="530" stroke="#555" stroke-width="1"/>
  <text x="845" y="520" font-size="9" fill="#555">1:M</text>

  <line x1="730" y1="580" x2="230" y2="180" stroke="#555" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="600" y="580" font-size="9" fill="#555">1:M (reviewed_by)</text>

  <text x="500" y="700" fill="#AEB4C4" font-size="10" text-anchor="middle">PK = Primary Key, FK = Foreign Key, UQ = Unique constraint. Matches database/schema.sql exactly.</text>
</svg>
