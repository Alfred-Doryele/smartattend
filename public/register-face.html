<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Face setup</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> SmartAttend</div>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>

  <div class="shell" style="max-width:480px;">
    <div class="card">
      <div class="eyebrow">One-time setup</div>
      <h2>Capture your face</h2>
      <p class="helper">Used to verify future check-ins. Face the light, fill the frame.</p>

      <div class="face-frame" id="frame">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas" width="220" height="220" style="display:none;"></canvas>

      <button class="secondary" id="captureBtn">Capture photo</button>
      <button class="primary" id="saveBtn" style="display:none;">Save &amp; continue</button>
      <div class="success-box" id="successBox" style="display:none;">Saved. Redirecting…</div>
      <div class="error-box" id="errorBox" style="display:none;"></div>
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/faceRecognition.js"></script>
<script>
  requireAuth(['student']);
  wireLogout('logoutBtn');

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  let capturedDataUrl = null;
  let cameraAvailable = false;

  navigator.mediaDevices?.getUserMedia({ video: true }).then(stream => {
    video.srcObject = stream;
    cameraAvailable = true;
  }).catch(() => {
    document.getElementById('frame').innerHTML = '<span style="padding:16px;text-align:center;">No camera detected</span>';
  });

  document.getElementById('captureBtn').addEventListener('click', () => {
    const ctx = canvas.getContext('2d');
    if (video.srcObject) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    else { ctx.fillStyle = '#1D3461'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    capturedDataUrl = canvas.toDataURL('image/png');
    document.getElementById('frame').innerHTML = '';
    document.getElementById('frame').appendChild(canvas);
    canvas.style.display = 'block';
    document.getElementById('saveBtn').style.display = 'inline-block';
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const errBox = document.getElementById('errorBox');
    const saveBtn = document.getElementById('saveBtn');
    errBox.style.display = 'none';
    saveBtn.disabled = true;
    saveBtn.textContent = 'Processing…';
    try {
      const descriptor = cameraAvailable
        ? await realDescriptorFromVideo(video)
        : demoDescriptorFromImageData(capturedDataUrl);
      await api('/auth/me/face', { method: 'PATCH', body: { faceDescriptor: descriptor } });
      document.getElementById('successBox').style.display = 'block';
      setTimeout(() => window.location.href = '/checkin.html', 1200);
    } catch (err) {
      errBox.textContent = err.message || err.data?.error || 'Could not save.';
      errBox.style.display = 'block';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save & continue';
    }
  });
</script>
</body>
</html>
