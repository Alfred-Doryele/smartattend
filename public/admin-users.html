<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Manage Users</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> SmartAttend</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="whoami"></span>
      <a href="/dashboard.html" style="color:#AEB8D0; font-size:.85rem;">← Dashboard</a>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="shell">
    <div class="card">
      <div class="eyebrow">Admin</div>
      <h2>Create an account</h2>
      <p class="helper">They log in with their ID and password below — not their email. Details are emailed automatically when possible.</p>

      <form id="createAccountForm">
        <label>Full name</label>
        <input type="text" id="newFullName" required>
        <label>Role</label>
        <select id="newRole">
          <option value="student">Student</option>
          <option value="lecturer">Lecturer</option>
        </select>
        <label>ID (index / staff number) — used to log in</label>
        <input type="text" id="newIndexNumber" placeholder="e.g. UENR/CE/21/001" required>
        <label>Email — where login details are sent</label>
        <input type="email" id="newEmail" required>
        <button class="primary" type="submit">Create account</button>
      </form>

      <div class="success-box" id="createSuccessBox" style="display:none;"></div>
      <div class="error-box" id="createErrorBox" style="display:none;"></div>
    </div>

    <div class="card">
      <div class="eyebrow">Your users</div>
      <h2>Students &amp; lecturers</h2>
      <select id="roleFilter">
        <option value="">All</option>
        <option value="student">Student</option>
        <option value="lecturer">Lecturer</option>
      </select>
      <table style="margin-top:16px;">
        <thead><tr><th>Name</th><th>Login ID</th><th>Email</th><th>Role</th><th>Password</th><th></th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

<script src="/js/api.js"></script>
<script>
  const user = requireAuth(['admin']);
  wireLogout('logoutBtn');
  document.getElementById('whoami').textContent = user.fullName;

  let allUsers = [];

  document.getElementById('createAccountForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('newFullName').value;
    const role = document.getElementById('newRole').value;
    const indexNumber = document.getElementById('newIndexNumber').value;
    const email = document.getElementById('newEmail').value;
    const successBox = document.getElementById('createSuccessBox');
    const errBox = document.getElementById('createErrorBox');
    successBox.style.display = 'none';
    errBox.style.display = 'none';

    try {
      const data = await api('/auth/create-account', { method: 'POST', body: { fullName, role, indexNumber, email } });
      successBox.style.display = 'block';
      successBox.innerHTML = `<strong>${data.fullName}</strong> created.<br>
        Login ID: <strong>${data.indexNumber}</strong> &nbsp;·&nbsp; Password: <strong>${data.temporaryPassword}</strong><br>
        <span style="font-size:.82rem;">${data.note}</span>`;
      document.getElementById('createAccountForm').reset();
      loadUsers();
    } catch (err) {
      errBox.textContent = err.data?.error || 'Could not create account.';
      errBox.style.display = 'block';
    }
  });

  async function loadUsers() {
    allUsers = await api('/users');
    render();
  }

  function render() {
    const filter = document.getElementById('roleFilter').value;
    const rows = filter ? allUsers.filter(u => u.role === filter) : allUsers;
    document.getElementById('usersBody').innerHTML = rows.map((u, i) => `
      <tr>
        <td>${u.full_name}</td>
        <td>${u.index_number || '—'}</td>
        <td>${u.email}</td>
        <td><span class="status-pill status-pending">${u.role}</span></td>
        <td>
          ${u.temp_password
            ? `<span id="pw-${i}" style="font-family:monospace;">••••••••</span>
               <button class="secondary" style="padding:3px 8px; font-size:.75rem;" onclick="togglePw(${i}, '${u.temp_password}')">Show</button>`
            : '<span class="helper">changed by user</span>'}
        </td>
        <td><button class="secondary" onclick="deactivate('${u.id}')">Remove</button></td>
      </tr>
    `).join('') || '<tr><td colspan="6" class="helper">No users created yet.</td></tr>';
  }

  function togglePw(i, pw) {
    const el = document.getElementById(`pw-${i}`);
    el.textContent = el.textContent === pw ? '••••••••' : pw;
  }

  document.getElementById('roleFilter').addEventListener('change', render);

  async function deactivate(id) {
    if (!confirm('Remove this account? This cannot be undone.')) return;
    try {
      await api(`/users/${id}/deactivate`, { method: 'PATCH' });
      loadUsers();
    } catch (err) { alert(err.data?.error || 'Could not remove user.'); }
  }

  loadUsers();
</script>
</body>
</html>
