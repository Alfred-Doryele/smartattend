<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="640" fill="#FFFFFF"/>
  <text x="450" y="36" fill="#1A2233" font-size="18" font-weight="bold" text-anchor="middle">SmartAttend — Use Case Diagram</text>

  <!-- System boundary -->
  <rect x="230" y="70" width="460" height="500" rx="8" fill="none" stroke="#1D3461" stroke-width="1.5"/>
  <text x="460" y="95" fill="#1D3461" font-size="13" font-weight="bold" text-anchor="middle">SmartAttend System</text>

  <!-- Actors -->
  <g id="student-actor">
    <circle cx="60" cy="180" r="14" fill="none" stroke="#0E1A30" stroke-width="2"/>
    <line x1="60" y1="194" x2="60" y2="230" stroke="#0E1A30" stroke-width="2"/>
    <line x1="30" y1="210" x2="90" y2="210" stroke="#0E1A30" stroke-width="2"/>
    <line x1="60" y1="230" x2="35" y2="260" stroke="#0E1A30" stroke-width="2"/>
    <line x1="60" y1="230" x2="85" y2="260" stroke="#0E1A30" stroke-width="2"/>
    <text x="60" y="280" font-size="12" text-anchor="middle" fill="#1A2233" font-weight="bold">Student</text>
  </g>

  <g id="lecturer-actor">
    <circle cx="60" cy="360" r="14" fill="none" stroke="#0E1A30" stroke-width="2"/>
    <line x1="60" y1="374" x2="60" y2="410" stroke="#0E1A30" stroke-width="2"/>
    <line x1="30" y1="390" x2="90" y2="390" stroke="#0E1A30" stroke-width="2"/>
    <line x1="60" y1="410" x2="35" y2="440" stroke="#0E1A30" stroke-width="2"/>
    <line x1="60" y1="410" x2="85" y2="440" stroke="#0E1A30" stroke-width="2"/>
    <text x="60" y="460" font-size="12" text-anchor="middle" fill="#1A2233" font-weight="bold">Lecturer</text>
  </g>

  <g id="admin-actor">
    <circle cx="830" cy="270" r="14" fill="none" stroke="#0E1A30" stroke-width="2"/>
    <line x1="830" y1="284" x2="830" y2="320" stroke="#0E1A30" stroke-width="2"/>
    <line x1="800" y1="300" x2="860" y2="300" stroke="#0E1A30" stroke-width="2"/>
    <line x1="830" y1="320" x2="805" y2="350" stroke="#0E1A30" stroke-width="2"/>
    <line x1="830" y1="320" x2="855" y2="350" stroke="#0E1A30" stroke-width="2"/>
    <text x="830" y="370" font-size="12" text-anchor="middle" fill="#1A2233" font-weight="bold">Administrator</text>
  </g>

  <!-- Use case ellipses -->
  <g font-size="11" fill="#1A2233">
    <ellipse cx="330" cy="110" rx="80" ry="22" fill="#DFF6F2" stroke="#0F9D8C"/>
    <text x="330" y="114" text-anchor="middle">Register / Login</text>

    <ellipse cx="330" cy="170" rx="80" ry="22" fill="#DFF6F2" stroke="#0F9D8C"/>
    <text x="330" y="174" text-anchor="middle">Capture face reference</text>

    <ellipse cx="330" cy="230" rx="80" ry="22" fill="#DFF6F2" stroke="#0F9D8C"/>
    <text x="330" y="234" text-anchor="middle">Check in to session</text>

    <ellipse cx="330" cy="290" rx="80" ry="22" fill="#DFF6F2" stroke="#0F9D8C"/>
    <text x="330" y="294" text-anchor="middle">View my attendance</text>

    <ellipse cx="580" cy="150" rx="85" ry="22" fill="#FDF1D6" stroke="#E3A008"/>
    <text x="580" y="154" text-anchor="middle">Create course &amp; session</text>

    <ellipse cx="580" cy="210" rx="85" ry="22" fill="#FDF1D6" stroke="#E3A008"/>
    <text x="580" y="214" text-anchor="middle">Monitor live dashboard</text>

    <ellipse cx="580" cy="270" rx="85" ry="22" fill="#FDF1D6" stroke="#E3A008"/>
    <text x="580" y="274" text-anchor="middle">Review flagged anomaly</text>

    <ellipse cx="460" cy="380" rx="90" ry="22" fill="#E7ECF6" stroke="#1D3461"/>
    <text x="460" y="384" text-anchor="middle">Generate attendance report</text>

    <ellipse cx="460" cy="440" rx="90" ry="22" fill="#E7ECF6" stroke="#1D3461"/>
    <text x="460" y="444" text-anchor="middle">Manage user accounts</text>

    <ellipse cx="460" cy="500" rx="90" ry="22" fill="#E7ECF6" stroke="#1D3461"/>
    <text x="460" y="504" text-anchor="middle">Register venue</text>
  </g>

  <!-- Student associations -->
  <line x1="90" y1="200" x2="255" y2="115" stroke="#888" stroke-width="1"/>
  <line x1="90" y1="205" x2="255" y2="175" stroke="#888" stroke-width="1"/>
  <line x1="90" y1="215" x2="255" y2="230" stroke="#888" stroke-width="1"/>
  <line x1="90" y1="225" x2="255" y2="290" stroke="#888" stroke-width="1"/>

  <!-- Lecturer associations -->
  <line x1="90" y1="380" x2="500" y2="155" stroke="#888" stroke-width="1"/>
  <line x1="90" y1="385" x2="500" y2="212" stroke="#888" stroke-width="1"/>
  <line x1="90" y1="390" x2="500" y2="270" stroke="#888" stroke-width="1"/>
  <line x1="90" y1="400" x2="375" y2="385" stroke="#888" stroke-width="1"/>

  <!-- Admin associations -->
  <line x1="800" y1="280" x2="550" y2="385" stroke="#888" stroke-width="1"/>
  <line x1="800" y1="290" x2="550" y2="445" stroke="#888" stroke-width="1"/>
  <line x1="800" y1="300" x2="550" y2="500" stroke="#888" stroke-width="1"/>
  <line x1="800" y1="270" x2="665" y2="215" stroke="#888" stroke-width="1"/>

  <text x="450" y="620" fill="#AEB4C4" font-size="10" text-anchor="middle">Actors: Student, Lecturer, Administrator — see docs/srs for full use case descriptions (UC-1, UC-2, UC-3)</text>
</svg>
