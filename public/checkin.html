<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Check in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> SmartAttend</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="whoami"></span>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="shell" style="max-width:520px;">
    <div class="card">
      <div class="eyebrow">Check in</div>
      <h2>Active session</h2>

      <label>Select session</label>
      <select id="sessionSelect"></select>

      <div class="face-frame" id="frame" style="margin-top:16px;">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas" width="220" height="220" style="display:none;"></canvas>

      <p class="helper" id="locStatus">Requesting your location…</p>

      <button class="secondary" id="captureBtn">Capture face</button>
      <button class="primary" id="submitBtn" style="display:none;">Submit check-in</button>

      <div id="resultBox" style="display:none; margin-top:14px;"></div>
    </div>

    <div class="card">
      <div class="eyebrow">Your recent attendance</div>
      <table id="historyTable">
        <thead><tr><th>Course</th><th>Date</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

<script src="/js/api.js"></script>
<script>
  const user = requireAuth(['student']);
  wireLogout('logoutBtn');
  document.getElementById('whoami').textContent = user.fullName;

  let coords = null;
  let capturedDataUrl = null;

  getGeolocation().then(loc => {
    coords = loc;
    document.getElementById('locStatus').textContent = loc
      ? `Location captured (±accuracy varies by device).`
      : `Location unavailable — this check-in will be flagged for review.`;
  });

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  navigator.mediaDevices?.getUserMedia({ video: true }).then(stream => { video.srcObject = stream; }).catch(() => {
    document.getElementById('frame').innerHTML = '<span style="padding:16px;text-align:center;">No camera — demo capture will be used.</span>';
  });

  document.getElementById('captureBtn').addEventListener('click', () => {
    const ctx = canvas.getContext('2d');
    if (video.srcObject) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    else { ctx.fillStyle = '#0F9D8C'; ctx.fillRect(0,0,220,220); }
    capturedDataUrl = canvas.toDataURL('image/png');
    document.getElementById('frame').innerHTML = '';
    document.getElementById('frame').appendChild(canvas);
    canvas.style.display = 'block';
    document.getElementById('submitBtn').style.display = 'inline-block';
  });

  async function loadSessions() {
    const select = document.getElementById('sessionSelect');
    try {
      const sessions = await api('/sessions/mine/open');
      if (!sessions.length) {
        select.innerHTML = '<option value="">No open sessions right now</option>';
        return;
      }
      select.innerHTML = sessions.map(s =>
        `<option value="${s.id}">${s.code} — ${s.title} (${new Date(s.start_time).toLocaleTimeString()})</option>`
      ).join('');
    } catch (err) {
      select.innerHTML = '<option value="">Could not load sessions</option>';
    }
  }
  loadSessions();
  document.getElementById('sessionSelect').addEventListener('focus', loadSessions);

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const sessionId = document.getElementById('sessionSelect').value;
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    if (!sessionId) {
      resultBox.className = 'error-box';
      resultBox.textContent = 'Please select or enter a session ID.';
      return;
    }
    try {
      const descriptor = demoDescriptorFromImageData(capturedDataUrl);
      const body = { sessionId, faceDescriptor: descriptor };
      if (coords) { body.latitude = coords.latitude; body.longitude = coords.longitude; }
      const data = await api('/checkins', { method: 'POST', body });
      resultBox.className = data.status === 'accepted' ? 'success-box' : 'error-box';
      resultBox.innerHTML = `<span class="status-pill status-${data.status}">${data.status}</span> ${data.message}`;
      loadHistory();
    } catch (err) {
      resultBox.className = 'error-box';
      resultBox.textContent = err.data?.error || 'Check-in failed.';
    }
  });

  async function loadHistory() {
    try {
      const rows = await api('/checkins/me');
      const tbody = document.querySelector('#historyTable tbody');
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.code} — ${r.title}</td>
          <td>${new Date(r.start_time).toLocaleDateString()}</td>
          <td><span class="status-pill status-${r.status}">${r.status}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="helper">No check-ins yet.</td></tr>';
    } catch (e) { /* silent for demo */ }
  }
  loadHistory();
</script>
</body>
</html>
