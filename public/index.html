<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Sign in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> SmartAttend</div>
    <div class="who">Attendance, verified</div>
  </div>

  <div class="shell" style="max-width:440px;">
    <div class="card">
      <div class="eyebrow" id="formEyebrow">Sign in</div>
      <h2 id="formTitle">Welcome back</h2>

      <form id="loginForm">
        <label>ID (students &amp; lecturers) or email (admins)</label>
        <input type="text" id="loginIdentifier" required placeholder="e.g. UENR/CE/21/001">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
        <button class="primary" type="submit">Sign in</button>
        <div class="error-box" id="loginError" style="display:none;"></div>
      </form>

      <p class="helper" style="margin-top:18px;">
        <a href="#" id="showForgot">Forgot password?</a>
      </p>
      <p class="helper" style="margin-top:6px;">
        Students &amp; lecturers: your administrator emails you your ID and password.
        &nbsp;<a href="#" id="showRegister">Register as an Administrator</a>
      </p>
    </div>

    <div class="card" id="forgotCard" style="display:none;">
      <div class="eyebrow">Reset password</div>
      <h2>Forgot your password?</h2>

      <form id="forgotRequestForm">
        <label>Email (the one login details were sent to)</label>
        <input type="email" id="forgotEmail" required placeholder="you@uenr.edu.gh">
        <button class="primary" type="submit">Send reset code</button>
        <div class="error-box" id="forgotRequestError" style="display:none;"></div>
      </form>

      <div id="forgotCodeBox" style="display:none; margin-top:16px;">
        <div class="success-box" id="forgotDevNote" style="margin-bottom:14px;"></div>
        <form id="forgotConfirmForm">
          <label>Reset code</label>
          <input type="text" id="resetToken" required placeholder="Code from your email">
          <label>New password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
          <button class="primary" type="submit">Update password</button>
          <div class="error-box" id="forgotConfirmError" style="display:none;"></div>
        </form>
      </div>
    </div>

    <div class="card" id="registerCard" style="display:none;">
      <div class="eyebrow">Register</div>
      <h2>Create an Administrator account</h2>
      <form id="registerForm">
        <label>Full name</label>
        <input type="text" id="regName" required>
        <label>Email</label>
        <input type="email" id="regEmail" required>
        <label>Password</label>
        <input type="password" id="regPassword" required minlength="6">
        <button class="primary" type="submit">Create account</button>
        <div class="error-box" id="registerError" style="display:none;"></div>
      </form>
    </div>
  </div>

<script src="/js/api.js"></script>
<script>
  document.getElementById('showRegister').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('registerCard').style.display = 'block';
    document.getElementById('forgotCard').style.display = 'none';
  });

  document.getElementById('showForgot').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('forgotCard').style.display = 'block';
    document.getElementById('registerCard').style.display = 'none';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('loginIdentifier').value;
    const password = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    errBox.style.display = 'none';
    try {
      const data = await api('/auth/login', { method: 'POST', body: { identifier, password } });
      setSession(data.token, data.user);
      if (data.user.role === 'student') {
        window.location.href = data.user.hasFaceReference ? '/checkin.html' : '/register-face.html';
      } else {
        window.location.href = '/dashboard.html';
      }
    } catch (err) {
      errBox.textContent = err.data?.error || 'Sign in failed.';
      errBox.style.display = 'block';
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const errBox = document.getElementById('registerError');
    errBox.style.display = 'none';
    try {
      await api('/auth/register', { method: 'POST', body: { fullName, email, password } });
      const data = await api('/auth/login', { method: 'POST', body: { identifier: email, password } });
      setSession(data.token, data.user);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errBox.textContent = err.data?.error || 'Registration failed.';
      errBox.style.display = 'block';
    }
  });

  document.getElementById('forgotRequestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgotEmail').value;
    const errBox = document.getElementById('forgotRequestError');
    errBox.style.display = 'none';
    try {
      const data = await api('/auth/password-reset/request', { method: 'POST', body: { email } });
      document.getElementById('forgotCodeBox').style.display = 'block';
      document.getElementById('forgotDevNote').textContent = data.devToken
        ? `Email not configured — your reset code is ${data.devToken}`
        : data.message;
    } catch (err) {
      errBox.textContent = err.data?.error || 'Could not process request.';
      errBox.style.display = 'block';
    }
  });

  document.getElementById('forgotConfirmForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = document.getElementById('resetToken').value;
    const newPassword = document.getElementById('newPassword').value;
    const errBox = document.getElementById('forgotConfirmError');
    errBox.style.display = 'none';
    try {
      await api('/auth/password-reset/confirm', { method: 'POST', body: { token, newPassword } });
      alert('Password updated. Sign in with your ID and new password.');
      document.getElementById('forgotCard').style.display = 'none';
    } catch (err) {
      errBox.textContent = err.data?.error || 'Could not reset password.';
      errBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
