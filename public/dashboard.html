<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> SmartAttend</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="whoami"></span>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div id="adminNav" style="display:none; background:#F6F7FB; border-bottom:1px solid var(--border); padding:10px 24px;">
    <div class="shell" style="padding:0; display:flex; gap:20px; align-items:center;">
      <span style="font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700;">Admin</span>
      <a href="/venues.html" style="color:var(--navy-950); font-size:.88rem; text-decoration:none; font-weight:600;">Venues</a>
      <a href="/admin-users.html" style="color:var(--navy-950); font-size:.88rem; text-decoration:none; font-weight:600;">Users</a>
    </div>
  </div>

  <div class="shell">
    <div class="grid-2">
      <div class="card">
        <div class="eyebrow">Step 1</div>
        <h2>Create a course</h2>
        <form id="courseForm">
          <label>Course code</label>
          <input type="text" id="courseCode" placeholder="CENG 302" required>
          <label>Course title</label>
          <input type="text" id="courseTitle" placeholder="Information Theory" required>
          <button class="primary" type="submit">Create course</button>
        </form>
        <div class="success-box" id="courseSuccess" style="display:none;"></div>
      </div>

      <div class="card">
        <div class="eyebrow">Step 2</div>
        <h2>Open a session</h2>
        <form id="sessionForm">
          <label>Course</label>
          <select id="sessionCourse" required></select>

          <label>Venue</label>
          <select id="venueSelect">
            <option value="">Capture my location instead…</option>
          </select>
          <p class="helper" id="venueHelper">Sets the check-in reference point.</p>

          <div id="liveLocationBlock">
            <button class="secondary" type="button" id="grabLocation">Capture my location</button>
            <span class="helper" id="locResult"></span>
            <div class="error-box" id="locWarning" style="display:none;"></div>
          </div>

          <label>Duration (minutes)</label>
          <input type="number" id="sessionDuration" value="60">
          <label>Re-verify after (minutes)</label>
          <input type="number" id="sessionReverify" value="30">
          <button class="primary" type="submit">Open session</button>
        </form>
        <div class="success-box" id="sessionSuccess" style="display:none;"></div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Live monitoring</div>
      <h2>Session dashboard</h2>
      <label>Session ID</label>
      <input type="text" id="dashSessionId" placeholder="Paste a session ID, or create one above">
      <button class="secondary" id="loadDashBtn" style="margin-top:8px;">Load</button>

      <h3 style="margin-top:24px;">Check-ins</h3>
      <table id="checkinsTable">
        <thead><tr><th>Student</th><th>Time</th><th>Score</th><th>Dist. (m)</th><th>±m</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>

      <h3 style="margin-top:24px;">Flagged</h3>
      <table id="flagsTable">
        <thead><tr><th>Student</th><th>Reason</th><th>Detail</th><th>Action</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <div class="eyebrow">Reports</div>
      <h2>Attendance analytics</h2>
      <label>Course</label>
      <select id="reportCourse"></select>
      <button class="secondary" id="loadReportBtn" style="margin-top:8px;">Load report</button>
      <div style="margin-top:16px;"><canvas id="attendanceChart" height="100"></canvas></div>
      <div style="margin-top:14px;">
        <a id="csvLink" class="secondary" style="text-decoration:none; display:inline-block; padding:9px 16px; border:1px solid var(--border); border-radius:8px; color:var(--navy-950); margin-right:8px;" href="#" target="_blank">Download CSV</a>
        <a id="pdfLink" class="secondary" style="text-decoration:none; display:inline-block; padding:9px 16px; border:1px solid var(--border); border-radius:8px; color:var(--navy-950);" href="#" target="_blank">Download PDF</a>
      </div>
    </div>
  </div>

<script src="/js/api.js"></script>
<script>
  const user = requireAuth(['lecturer', 'admin']);
  wireLogout('logoutBtn');
  document.getElementById('whoami').textContent = `${user.fullName} · ${user.role}`;
  if (user.role === 'admin') document.getElementById('adminNav').style.display = 'block';

  let capturedLoc = null;

  async function loadCourses() {
    const courses = await api('/users/courses');
    document.getElementById('sessionCourse').innerHTML =
      courses.map(c => `<option value="${c.id}">${c.code} — ${c.title}</option>`).join('');
  }
  loadCourses();

  async function loadVenues() {
    try {
      const venues = await api('/users/venues');
      document.getElementById('venueSelect').innerHTML =
        '<option value="">Capture my location instead…</option>' +
        venues.map(v => `<option value="${v.id}">${v.name} (±${v.radius_meters}m)</option>`).join('');
    } catch (err) {}
  }
  loadVenues();

  document.getElementById('venueSelect').addEventListener('change', (e) => {
    const usingVenue = !!e.target.value;
    document.getElementById('liveLocationBlock').style.display = usingVenue ? 'none' : 'block';
    document.getElementById('venueHelper').textContent = usingVenue
      ? 'Using this fixed venue — no GPS capture needed.'
      : 'Sets the check-in reference point.';
  });

  document.getElementById('courseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('courseCode').value;
    const title = document.getElementById('courseTitle').value;
    try {
      await api('/users/courses', { method: 'POST', body: { code, title, lecturerId: user.id } });
      document.getElementById('courseSuccess').style.display = 'block';
      document.getElementById('courseSuccess').textContent = `"${code}" created.`;
      loadCourses();
      loadReportCourses();
    } catch (err) { alert(err.data?.error || 'Failed to create course.'); }
  });

  document.getElementById('grabLocation').addEventListener('click', async () => {
    const btn = document.getElementById('grabLocation');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Capturing…';
    const loc = await getGeolocation();
    btn.disabled = false;
    btn.textContent = original;
    if (!loc) { document.getElementById('locResult').textContent = 'Could not get location.'; return; }
    capturedLoc = loc;
    const quality = loc.accuracy > 100 ? '⚠ weak' : loc.accuracy > 30 ? 'fair' : 'strong';
    document.getElementById('locResult').textContent = `±${Math.round(loc.accuracy)}m (${quality})`;
    const warnBox = document.getElementById('locWarning');
    if (loc.accuracy > 150) {
      warnBox.style.display = 'block';
      warnBox.textContent = `This device's location is only accurate to ±${Math.round(loc.accuracy)}m — laptops usually have no real GPS chip and estimate position from WiFi, which can be very inaccurate. For a reliable check-in radius, capture this location from a phone instead (Admin → Venues), then select that venue above rather than using live capture.`;
    } else {
      warnBox.style.display = 'none';
    }
  });

  document.getElementById('sessionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const courseId = document.getElementById('sessionCourse').value;
    const venueId = document.getElementById('venueSelect').value;
    const durationMinutes = Number(document.getElementById('sessionDuration').value);
    const reverifyAfterMinutes = Number(document.getElementById('sessionReverify').value);
    const body = { courseId, startTime: new Date().toISOString(), durationMinutes, reverifyAfterMinutes };

    if (venueId) {
      body.venueId = venueId;
    } else {
      if (!capturedLoc) { alert('Capture your location or pick a venue first.'); return; }
      body.latitude = capturedLoc.latitude;
      body.longitude = capturedLoc.longitude;
      body.accuracy = capturedLoc.accuracy;
    }

    try {
      const data = await api('/sessions', { method: 'POST', body });
      const box = document.getElementById('sessionSuccess');
      box.style.display = 'block';
      box.innerHTML = `Session open. Share this ID: <strong>${data.id}</strong>`;
      document.getElementById('dashSessionId').value = data.id;
      loadDashboard(data.id);
    } catch (err) { alert(err.data?.error || 'Failed to open session.'); }
  });

  document.getElementById('loadDashBtn').addEventListener('click', () => {
    const id = document.getElementById('dashSessionId').value;
    if (id) loadDashboard(id);
  });

  async function loadDashboard(sessionId) {
    try {
      const data = await api(`/sessions/${sessionId}/dashboard`);
      const cBody = document.querySelector('#checkinsTable tbody');
      cBody.innerHTML = data.checkins.map(c => `
        <tr>
          <td>${c.full_name} (${c.index_number || '—'})</td>
          <td>${new Date(c.checked_in_at).toLocaleTimeString()}</td>
          <td>${c.face_match_score?.toFixed(3) ?? '—'}</td>
          <td>${c.distance_from_venue_meters ? Math.round(c.distance_from_venue_meters) : '—'}</td>
          <td>${c.student_accuracy_meters ? Math.round(c.student_accuracy_meters) : '—'}</td>
          <td><span class="status-pill status-${c.status}">${c.status}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="helper">No check-ins yet.</td></tr>';

      const fBody = document.querySelector('#flagsTable tbody');
      const unresolved = data.flags.filter(f => !f.resolved);
      fBody.innerHTML = unresolved.map(f => `
        <tr>
          <td>${f.full_name}</td>
          <td>${f.reason}</td>
          <td>${f.detail || ''}</td>
          <td>
            <button class="secondary" onclick="resolveFlag('${f.id}','confirmed_present','${sessionId}')">Confirm</button>
            <button class="secondary" onclick="resolveFlag('${f.id}','marked_absent','${sessionId}')">Absent</button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="helper">No flags.</td></tr>';
    } catch (err) { alert(err.data?.error || 'Could not load dashboard.'); }
  }

  async function resolveFlag(flagId, resolution, sessionId) {
    try {
      await api(`/sessions/flags/${flagId}/resolve`, { method: 'PATCH', body: { resolution } });
      loadDashboard(sessionId);
    } catch (err) { alert(err.data?.error || 'Could not resolve flag.'); }
  }

  let attendanceChart = null;

  async function loadReportCourses() {
    const courses = await api('/users/courses');
    document.getElementById('reportCourse').innerHTML =
      courses.map(c => `<option value="${c.id}">${c.code} — ${c.title}</option>`).join('');
  }
  loadReportCourses();

  document.getElementById('loadReportBtn').addEventListener('click', async () => {
    const courseId = document.getElementById('reportCourse').value;
    if (!courseId) return;
    try {
      const rows = await api(`/reports/courses/${courseId}/attendance`);
      const ctx = document.getElementById('attendanceChart');
      const labels = rows.map(r => r.full_name);
      const attended = rows.map(r => r.attended || 0);
      const flagged = rows.map(r => r.flagged || 0);
      if (attendanceChart) attendanceChart.destroy();
      attendanceChart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [
          { label: 'Attended', data: attended, backgroundColor: '#0F9D8C' },
          { label: 'Flagged', data: flagged, backgroundColor: '#E3A008' },
        ]},
        options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
      });
      setupDownload('csvLink', `/reports/courses/${courseId}/attendance.csv`, `attendance-${courseId}.csv`);
      setupDownload('pdfLink', `/reports/courses/${courseId}/attendance.pdf`, `attendance-${courseId}.pdf`);
    } catch (err) { alert(err.data?.error || 'Could not load report.'); }
  });

  function setupDownload(linkId, path, filename) {
    const link = document.getElementById(linkId);
    link.onclick = async (e) => {
      e.preventDefault();
      const res = await fetch('/api' + path, { headers: { Authorization: `Bearer ${getToken()}` } });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    };
  }
</script>
</body>
</html>
