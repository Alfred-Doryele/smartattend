<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Check in</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> SmartAttend</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="whoami"></span>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="shell" style="max-width:520px;">
    <div class="card">
      <div class="eyebrow">Check in</div>
      <h2>Active session</h2>

      <label>Select session</label>
      <select id="sessionSelect"></select>

      <label style="margin-top:14px;">Or paste a session ID</label>
      <input type="text" id="manualSessionId" placeholder="Session ID from your lecturer">

      <div class="face-frame" id="frame" style="margin-top:16px;">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas" width="220" height="220" style="display:none;"></canvas>

      <p class="helper" id="locStatus">Getting your location…</p>

      <button class="secondary" id="captureBtn">Capture face</button>
      <button class="primary" id="submitBtn" style="display:none;">Submit check-in</button>

      <div id="resultBox" style="display:none; margin-top:14px;"></div>
    </div>

    <div class="card">
      <div class="eyebrow">Recent attendance</div>
      <table id="historyTable">
        <thead><tr><th>Course</th><th>Date</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/faceRecognition.js"></script>
<script>
  const user = requireAuth(['student']);
  wireLogout('logoutBtn');
  document.getElementById('whoami').textContent = user.fullName;

  let coords = null;
  let capturedDataUrl = null;
  let cameraAvailable = false;

  getGeolocation().then(loc => {
    coords = loc;
    const status = document.getElementById('locStatus');
    if (!loc) { status.textContent = 'Location unavailable — will be flagged for review.'; return; }
    const quality = loc.accuracy > 100 ? 'weak — move near a window' : loc.accuracy > 30 ? 'fair' : 'strong';
    status.textContent = `Location: ±${Math.round(loc.accuracy)}m (${quality})`;
  });

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  navigator.mediaDevices?.getUserMedia({ video: true }).then(stream => {
    video.srcObject = stream;
    cameraAvailable = true;
  }).catch(() => {
    document.getElementById('frame').innerHTML = '<span style="padding:16px;text-align:center;">No camera available</span>';
  });

  document.getElementById('captureBtn').addEventListener('click', () => {
    const ctx = canvas.getContext('2d');
    if (video.srcObject) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    else { ctx.fillStyle = '#0F9D8C'; ctx.fillRect(0,0,220,220); }
    capturedDataUrl = canvas.toDataURL('image/png');
    document.getElementById('frame').innerHTML = '';
    document.getElementById('frame').appendChild(canvas);
    canvas.style.display = 'block';
    document.getElementById('submitBtn').style.display = 'inline-block';
  });

  async function loadSessions() {
    const select = document.getElementById('sessionSelect');
    try {
      const sessions = await api('/sessions/mine/open');
      if (!sessions.length) { select.innerHTML = '<option value="">No open sessions</option>'; return; }
      select.innerHTML = sessions.map(s =>
        `<option value="${s.id}">${s.code} — ${s.title} (${new Date(s.start_time).toLocaleTimeString()})</option>`
      ).join('');
    } catch (err) { select.innerHTML = '<option value="">Could not load sessions</option>'; }
  }
  loadSessions();
  document.getElementById('sessionSelect').addEventListener('focus', loadSessions);

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const manualId = document.getElementById('manualSessionId').value.trim();
    const sessionId = manualId || document.getElementById('sessionSelect').value;
    const resultBox = document.getElementById('resultBox');
    const submitBtn = document.getElementById('submitBtn');
    if (!sessionId) {
      resultBox.style.display = 'block';
      resultBox.className = 'error-box';
      resultBox.textContent = 'Select or paste a session ID.';
      return;
    }
    const original = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="btn-spinner"></span> Verifying…';
    resultBox.style.display = 'none';
    try {
      const descriptor = cameraAvailable
        ? await realDescriptorFromVideo(video)
        : demoDescriptorFromImageData(capturedDataUrl);
      const body = { sessionId, faceDescriptor: descriptor };
      if (coords) { body.latitude = coords.latitude; body.longitude = coords.longitude; body.accuracy = coords.accuracy; }
      const data = await api('/checkins', { method: 'POST', body });
      resultBox.style.display = 'block';
      resultBox.className = data.status === 'accepted' ? 'success-box' : 'error-box';
      let extra = '';
      if (data.distanceFromVenueMeters != null) {
        extra = ` (${Math.round(data.distanceFromVenueMeters)}m away, ±${Math.round(data.accuracyMeters || 0)}m)`;
      }
      resultBox.innerHTML = `<span class="status-pill status-${data.status}">${data.status}</span> ${data.message}${extra}`;
      loadHistory();
    } catch (err) {
      resultBox.style.display = 'block';
      resultBox.className = 'error-box';
      resultBox.textContent = err.message || err.data?.error || 'Check-in failed.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = original;
    }
  });

  async function loadHistory() {
    try {
      const rows = await api('/checkins/me');
      document.querySelector('#historyTable tbody').innerHTML = rows.map(r => `
        <tr>
          <td>${r.code} — ${r.title}</td>
          <td>${new Date(r.start_time).toLocaleDateString()}</td>
          <td><span class="status-pill status-${r.status}">${r.status}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="helper">No check-ins yet.</td></tr>';
    } catch (e) {}
  }
  loadHistory();
</script>
</body>
</html>
